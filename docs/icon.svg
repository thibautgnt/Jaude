<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Jaude icon">
<style>
  .wave { animation: swell 4.5s linear infinite; }
  .wave.back { animation-duration: 7s; animation-direction: reverse; }
  .tide { animation: bob 3.2s ease-in-out infinite alternate; }
  .arc { transform-box: view-box; transform-origin: 512px 512px; transform: rotate(-90deg); animation: breathe 5s ease-in-out infinite alternate; }
  @keyframes swell { to { transform: translateX(392px); } }
  @keyframes bob { from { transform: translateY(-7px); } to { transform: translateY(7px); } }
  @keyframes breathe { from { transform: rotate(-96deg); stroke-dasharray: 69 100; } to { transform: rotate(-84deg); stroke-dasharray: 75 100; } }
  @media (prefers-reduced-motion: reduce) { .wave, .tide, .arc { animation: none; } }
</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#548fff"/><stop offset="1" stop-color="#1a38b3"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="100" x2="0" y2="464" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="disc"><circle cx="512" cy="512" r="196"/></clipPath>
    <filter id="body-shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".3"/></filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-opacity=".25"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#body-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <g filter="url(#lift)">
    <circle cx="512" cy="512" r="282" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="54"/>
    <circle class="arc" cx="512" cy="512" r="282" fill="none" stroke="#fff" stroke-width="54" stroke-linecap="round" pathLength="100" stroke-dasharray="72 100"/>
  </g>
  <circle cx="512" cy="512" r="196" fill="#fff" fill-opacity=".16"/>
  <g clip-path="url(#disc)">
    <g class="tide">
      <path class="wave back" d="M-76 470q98-26 196 0t196 0t196 0t196 0t196 0t196 0V760H-76z" fill="#fff" fill-opacity=".35"/>
      <path class="wave" d="M-76 481q98-28 196 0t196 0t196 0t196 0t196 0t196 0V760H-76z" fill="#fff"/>
    </g>
  </g>
</svg>
